<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChatGPT</title>
<style>
:root{--bg:#fbfbfb;--fg:#0d0d0d;--sub:#6b6b6b;--line:#e3e3e3;--blue:#4169e1;--bub:#eaf0fd;box-sizing:border-box;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.main{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);background:var(--bg);transition:transform .28s ease;border-radius:0}
.open .main{transform:translateX(82%);border-radius:44px;box-shadow:-8px 0 30px rgba(0,0,0,.1)}
.circ{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.hdr .r{display:flex;gap:8px}
.msgs{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:22px}
.u{align-self:flex-end;max-width:80%;background:var(--bub);color:#2a45b0;padding:12px 18px;border-radius:22px;font-size:17px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.a{font-size:17px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.a small{display:block;margin-top:8px;color:var(--sub);font-size:12px}
.sug{padding:0 20px 14px;display:flex;flex-direction:column;gap:4px}
.sug button{display:flex;align-items:center;gap:14px;padding:12px 0;color:var(--sub);font-size:18px;text-align:left}
.bar{padding:10px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);position:relative}
.inp{display:flex;align-items:center;gap:8px;height:54px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 8px 0 14px}
.inp input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:17px;background:none;color:var(--fg)}
.inp input::placeholder{color:#9a9a9a}
.vb{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}
.menu{position:absolute;left:18px;bottom:84px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:6px;min-width:230px;z-index:5}
.menu button{display:flex;gap:12px;align-items:center;width:100%;padding:12px;font-size:16px;border-radius:12px}
.menu button:active{background:#f1f1f1}
.hide{display:none!important}
.side{position:absolute;inset:0;width:82%;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 0 0;background:var(--bg)}
.side h1{margin:0;font-size:34px;font-weight:700}
.sh{display:flex;justify-content:space-between;align-items:center;padding:6px 20px 14px 22px}
.nav{padding:0 22px}
.nav button{display:flex;gap:18px;align-items:center;height:56px;width:100%;font-size:20px;text-align:left}
.sep{height:1px;background:var(--line);margin:14px 22px 6px}
.hist{flex:1;overflow-y:auto;padding:0 22px}
.hist button{display:block;width:100%;text-align:left;padding:15px 0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--sub);padding:24px 0;font-size:15px}
.sf{display:flex;justify-content:space-between;align-items:center;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px)) 22px;background:var(--bg)}
.chat{display:flex;align-items:center;gap:10px;height:54px;padding:0 28px 0 24px;border-radius:999px;background:var(--blue);color:#fff;font-size:20px;font-weight:600}
.scrim{position:absolute;top:0;bottom:0;right:0;width:18%;z-index:3}
.scr{position:absolute;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.scr .hdr{border-bottom:1px solid var(--line)}
.scr h2{margin:0;font-size:18px}
.scr .body{flex:1;overflow-y:auto;padding:8px 20px}
.row{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);font-size:17px;text-align:left;width:100%}
.row span{color:var(--sub);font-size:14px;margin-left:auto}
.sbar{flex:1;display:flex;align-items:center;gap:8px;height:44px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 14px}
.sbar input{flex:1;border:0;outline:0;font:inherit;font-size:16px;background:none}
.res p{margin:4px 0 0;color:var(--sub);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<div id="app">
<aside class="side" id="side">
 <div class="sh"><h1>ChatGPT</h1><button class="circ" id="bSearch" aria-label="검색"><svg data-i="search"/></button></div>
 <div class="nav" id="nav"></div><div class="sep"></div>
 <div class="hist" id="hist"></div>
 <div class="sf"><button class="chat" id="bChat"><svg data-i="edit"/>Chat</button><button class="circ" id="bSet" aria-label="설정"><svg data-i="gear"/></button></div>
</aside>
<div class="main" id="main">
 <div class="hdr"><button class="circ" id="bMenu" aria-label="메뉴"><svg data-i="menu"/></button>
 <div class="r"><button class="circ" id="bNew" aria-label="새 대화"><svg data-i="chat"/></button></div></div>
 <div class="msgs" id="msgs"></div>
 <div class="sug" id="sug"></div>
 <div class="bar"><div class="menu hide" id="amenu">
  <button data-a="photo"><svg data-i="image"/>사진 및 이미지 첨부</button>
  <button data-a="file"><svg data-i="file"/>파일 첨부</button></div>
  <div class="inp"><button id="bPlus" aria-label="첨부"><svg data-i="plus" style="width:28px;height:28px"/></button>
  <input id="inp" placeholder="ChatGPT에게 물어보기" enterkeyhint="send" autocomplete="off">
  <button id="bMic" aria-label="마이크"><svg data-i="mic"/></button>
  <button class="vb" id="bGo" aria-label="음성 모드"><svg data-i="wave"/></button></div></div>
 <div class="scrim hide" id="scrim"></div>
</div>
<div class="scr hide" id="scr"></div>
</div>
<script>
const I={menu:'<path d="M4 8h16M4 15h10"/>',chat:'<path d="M12 4a8 7.5 0 1 1-4.2 13.8L4 19l1-3.6A7.5 7.5 0 0 1 12 4z"/>',edit:'<path d="M12 4H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-5"/><path d="M19 3l2 2-8 8-3 1 1-3z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',plus:'<path d="M12 4v16M4 12h16"/>',mic:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',wave:'<path d="M6 10v4M10 6v12M14 8v8M18 10v4"/>',up:'<path d="M12 19V5M6 11l6-6 6 6"/>',image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="15" cy="9.5" r="1.8"/><path d="M4 18l5-5 4 3 3-2 4 3"/>',pen:'<path d="M4 20l1-4L17 4l3 3L8 19z"/><path d="M14 7l3 3"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',lib:'<rect x="3" y="5" width="4" height="15" rx="1.5"/><rect x="9" y="5" width="4" height="15" rx="1.5"/><path d="M15 6l4-1 2 14-4 1z"/>',folder:'<path d="M3 8a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 11h18"/>',plug:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M15.5 12v2a2 2 0 0 0 4 0"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l-3 3"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/><path d="M17.5 2.5l3.5 3.5-3.5 3.5L14 6z"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2l2 2.5 3.2-.5.8 3.1 3 1.2-1 3.2 1 3.2-3 1.2-.8 3.1-3.2-.5L12 22l-2-2.5-3.2.5-.8-3.1-3-1.2 1-3.2-1-3.2 3-1.2.8-3.1 3.2.5z"/>',back:'<path d="M15 5l-7 7 7 7"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',file:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',chev:'<path d="M9 5l7 7-7 7"/>'};
const $=s=>document.querySelector(s),app=$('#app');
function icons(r=document){r.querySelectorAll('svg[data-i]').forEach(s=>{s.setAttribute('viewBox','0 0 24 24');s.innerHTML=I[s.dataset.i]||'';s.removeAttribute('data-i')})}
const ic=n=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let st={chats:[],cur:null};
try{const s=localStorage.getItem('cgpt');if(s)st=JSON.parse(s)}catch(e){}
if(!st.chats.length){const t=Date.now(),m=(a,b)=>[{r:'u',t:a},{r:'a',t:b}];
st.chats=[['카톡 인스타 여백 제거 수정','여백 제거 방법 알려줘'],['프롬프트 작성','프롬프트 써줘'],['인덱스 수정 완료','인덱스 수정해줘'],['앱 프롬프트 작성','앱 프롬프트 작성'],['상단바 삭제 하단바 추가','상단바 삭제해줘']].map((x,i)=>({id:'s'+i,title:x[0],ts:t-i*1000,msgs:m(x[1],'(샘플 대화입니다) 요청하신 내용을 정리해 드릴게요.')}));st.cur=null}
const save=()=>{try{localStorage.setItem('cgpt',JSON.stringify(st))}catch(e){}};
const chat=()=>st.chats.find(c=>c.id===st.cur);
function render(){const c=chat(),m=$('#msgs');
 m.innerHTML=c?c.msgs.map(x=>x.r==='u'?`<div class="u">${esc(x.t)}</div>`:`<div class="a">${esc(x.t)}<small>로컬 시뮬레이션 응답</small></div>`).join(''):'';
 $('#sug').classList.toggle('hide',!!c&&c.msgs.length>0);m.scrollTop=m.scrollHeight;
 const h=$('#hist'),l=[...st.chats].sort((a,b)=>b.ts-a.ts);
 h.innerHTML=l.length?l.map(x=>`<button data-id="${x.id}">${esc(x.title)}</button>`).join(''):'<div class="empty">대화 기록이 없습니다</div>';
 upd()}
function upd(){const v=$('#inp').value.trim();$('#bGo').innerHTML=ic(v?'up':'wave');$('#bGo').setAttribute('aria-label',v?'전송':'음성 모드');$('#bMic').classList.toggle('hide',!!v)}
function side(o){app.classList.toggle('open',o);$('#scrim').classList.toggle('hide',!o)}
function newChat(){st.cur=null;save();side(false);render()}
function send(t){t=t.trim();if(!t)return;let c=chat();
 if(!c){c={id:'c'+Date.now(),title:t.slice(0,30),ts:Date.now(),msgs:[]};st.chats.push(c);st.cur=c.id}
 c.msgs.push({r:'u',t});c.ts=Date.now();$('#inp').value='';save();render();
 const id=c.id;setTimeout(()=>{const k=st.chats.find(x=>x.id===id);if(!k)return;k.msgs.push({r:'a',t:'실제 AI에 연결되어 있지 않아 정해진 샘플 응답을 보여드려요.\n입력하신 내용: "'+t.slice(0,60)+'"'});save();render()},700)}
const sug=[['image','이미지나 스티커 만들어줘'],['pen','글쓰기'],['globe','웹 검색']];
$('#sug').innerHTML=sug.map((s,i)=>`<button data-s="${i}">${ic(s[0])}${s[1]}</button>`).join('');
const pre=['이미지나 스티커 만들어줘: ','글쓰기: ','웹 검색: '];
$('#sug').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=$('#inp');i.value=pre[b.dataset.s];i.focus();upd()};
const nav=[['lib','라이브러리','저장된 파일과 자료가 아직 없습니다.'],['folder','프로젝트','프로젝트가 없습니다. 이 데모에는 프로젝트 기능이 연결되어 있지 않아요.'],['plug','플러그인','연결 가능한 플러그인이 없습니다.'],['clock','예약','예약된 작업이 없습니다.'],['grid','탐색하기','탐색할 수 있는 GPT가 아직 없습니다.']];
$('#nav').innerHTML=nav.map((n,i)=>`<button data-n="${i}">${ic(n[0])}${n[1]}</button>`).join('');
function scr(title,body,extra=''){const s=$('#scr');s.classList.remove('hide');s.innerHTML=`<div class="hdr"><button class="circ" data-x aria-label="닫기">${ic('back')}</button>${extra||`<h2>${title}</h2>`}<span style="width:44px"></span></div><div class="body">${body}</div>`;s.querySelector('[data-x]').onclick=()=>s.classList.add('hide');return s}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;const n=nav[b.dataset.n];scr(n[1],`<div class="empty">${n[2]}</div>`)};
$('#bSet').onclick=()=>{const L=['계정 및 프로필','개인화','알림','데이터 제어','음성','언어','앱 정보'];
 const s=scr('설정',L.map(x=>`<button class="row" data-l="${x}">${ic('user')}${x}<span>${ic('chev')}</span></button>`).join('')+'<div class="empty">이 화면은 데모용이며 실제 설정은 저장되지 않아요. 대화 기록만 이 브라우저에 보관됩니다.</div><button class="row" id="clr">대화 기록 모두 삭제</button>');
 s.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>scr(b.dataset.l,'<div class="empty">이 항목은 아직 구현되지 않았습니다.</div>'));
 s.querySelector('#clr').onclick=()=>{if(confirm('모든 대화 기록을 삭제할까요?')){st={chats:[],cur:null};save();render();s.classList.add('hide')}}};
$('#bSearch').onclick=()=>{const s=scr('','<div class="res" id="res"></div>','<div class="sbar">'+ic('search')+'<input id="q" placeholder="검색" autofocus><button id="qc" aria-label="지우기">'+ic('x')+'</button></div>');
 const q=s.querySelector('#q'),r=s.querySelector('#res');
 const run=()=>{const k=q.value.trim().toLowerCase();const l=st.chats.filter(c=>!k||c.title.toLowerCase().includes(k)||c.msgs.some(m=>m.t.toLowerCase().includes(k))).sort((a,b)=>b.ts-a.ts);
  r.innerHTML=l.length?l.map(c=>{const m=k&&c.msgs.find(m=>m.t.toLowerCase().includes(k));return `<button class="row" data-id="${c.id}" style="display:block"><div>${esc(c.title)}</div>${m?`<p>${esc(m.t)}</p>`:''}</button>`}).join(''):'<div class="empty">검색 결과가 없습니다</div>'};
 q.oninput=run;run();s.querySelector('#qc').onclick=()=>{q.value='';run();q.focus()};
 r.onclick=e=>{const b=e.target.closest('[data-id]');if(b){st.cur=b.dataset.id;save();s.classList.add('hide');side(false);render()}}};
$('#hist').onclick=e=>{const b=e.target.closest('button');if(b){st.cur=b.dataset.id;save();side(false);render()}};
$('#bMenu').onclick=()=>side(!app.classList.contains('open'));$('#scrim').onclick=()=>side(false);
$('#bChat').onclick=newChat;$('#bNew').onclick=newChat;
$('#bPlus').onclick=e=>{e.stopPropagation();$('#amenu').classList.toggle('hide')};
document.addEventListener('click',e=>{if(!e.target.closest('#amenu'))$('#amenu').classList.add('hide')});
$('#amenu').onclick=e=>{const b=e.target.closest('button');if(b){$('#amenu').classList.add('hide');alert('이 데모에서는 파일 업로드를 지원하지 않습니다.')}};
$('#bGo').onclick=()=>{const v=$('#inp').value;v.trim()?send(v):alert('음성 모드는 이 데모에서 지원되지 않습니다.')};
$('#bMic').onclick=()=>alert('음성 입력은 이 데모에서 지원되지 않습니다.');
$('#inp').oninput=upd;$('#inp').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)send($('#inp').value)};
if(window.visualViewport){const f=()=>{app.style.height=visualViewport.height+'px'};visualViewport.addEventListener('resize',f);f()}
icons();render();
</script></body></html>
