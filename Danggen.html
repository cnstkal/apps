function readImg(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))};im.onerror=()=>r(null);im.src=fr.result};fr.readAsDataURL(f)})}

V.notif=()=>{const N=[['chat','가나다라abc님이 메시지를 보냈어요','쿠팡에서 시킨 배송내역은있어요','7시간 전','room','c2'],['chat','포카러버님이 메시지를 보냈어요','직거래 가능하세요?','3시간 전','room','c1'],['deal','관심 상품 가격이 내려갔어요','LG 그램 17인치 노트북 · 450,000원','어제','open','p6'],['deal','끌어올리기 할 수 있어요','책 일괄판매 (20권)','2일 전','manage','']];return`<div class="hd"><button class="ic" data-a="back" aria-label="뒤로">${I.back}</button><h2>알림</h2><span style="width:36px"></span></div><div class="scroll">${N.map(n=>`<div class="nt" data-a="${n[4]}" data-id="${n[5]}"><div class="ci">${n[0]==='chat'?I.chat:I.rc}</div><div><b>${n[1]}</b><p>${n[2]}</p><small>${n[3]}</small></div></div>`).join('')}</div>`};
V.list=t=>{const ids=S[t.k];const l=ids.map(post).filter(Boolean);return`<div class="hd"><button class="ic" data-a="back" aria-label="뒤로">${I.back}</button><h2>${t.k==='likes'?'관심목록':'최근 본'}</h2><span style="width:36px"></span></div><div class="scroll">${l.length?l.map(row).join(''):'<div class="empty">아직 없어요</div>'}</div>`};
const AFTER={home:()=>{S.nbell=0},detail:t=>{const sc=$('.scroll'),g=$('#gal'),d=$('#dtop');if(g){g.onscroll=()=>{const c=$('#gc');if(c)c.textContent=(Math.round(g.scrollLeft/g.clientWidth)+1)+' / '+t.n};t.n=post(t.id).imgs.length;sc.onscroll=()=>d.classList.toggle('solid',sc.scrollTop>g.clientHeight-60)}},room:t=>{const c=chat(t.id);if(c.unread){c.unread=0;save();renderTabs()}drawMsgs();const i=$('#inp');i.oninput=updSend;i.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)ACT.send()};updSend()},search:()=>{const q=$('#q');q.oninput=drawSearch;q.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)addRecent(q.value)};drawSearch()},write:t=>{FI=t.id?[...post(t.id).imgs]:FI;drawPh();$('#file').onchange=async e=>{for(const f of [...e.target.files]){if(FI.length>=10)break;const s=await readImg(f);if(s)FI.push(s)}e.target.value='';drawPh()}}};
function updSend(){const i=$('#inp'),s=$('#sd');if(i&&s)s.classList.toggle('on',!!i.value.trim())}
function addRecent(v){v=v.trim();if(!v)return;S.searches=[v,...S.searches.filter(x=>x!==v)].slice(0,10);save()}
function renderTabs(){const s=cur().s,t=$('#tabs');t.hidden=!['home','chats','my'].includes(s);if(!t.hidden)t.innerHTML=tabsH()}
function render(){const t=cur(),k=t.s+(t.id||t.k||'');const sc=$('.scroll'),y=k===lastKey&&sc?sc.scrollTop:(t.y||0);lastKey=k;$('#view').innerHTML=V[t.s](t);const n=$('.scroll');if(n&&t.s!=='room')n.scrollTop=y;renderTabs();AFTER[t.s]&&AFTER[t.s](t);if(t.s==='detail'&&n)n.dispatchEvent(new Event('scroll'))}
function openChat(pid){let c=S.chats.find(c=>c.postId===pid);if(!c){const p=post(pid);c={id:'c'+Date.now(),postId:pid,name:p.seller.name,temp:p.seller.temp,dong:p.seller.dong,resp:'보통 10분 이내 응답',unread:0,upd:Date.now(),msgs:[],snap:{title:p.title,price:p.price,img:p.imgs[0]||''}};S.chats.unshift(c);p.chats++;save()}push('room',{id:c.id})}
function delPost(id){S.posts=S.posts.filter(p=>p.id!==id);S.likes=S.likes.filter(x=>x!==id);S.recents=S.recents.filter(x=>x!==id);save()}
const REP=['네 안녕하세요!','가능해요. 시간 언제 괜찮으세요?','사진 더 보내드릴게요','네고는 어려워요 ㅠㅠ'];
const ACT={
noop(){},close(){$('#sheet').innerHTML=''},toast(e){toast(e.m)},
tab(e){go(e.id)},back,
open(e){const p=post(e.id);if(!p)return;p.views++;S.recents=[p.id,...S.recents.filter(x=>x!==p.id)].slice(0,30);save();push('detail',{id:e.id})},
filter(e){homeF=e.v;render()},mfilter(e){manF=e.v;render()},
like(e){const p=post(e.id),i=S.likes.indexOf(p.id);if(i<0){S.likes.push(p.id);p.likes++}else{S.likes.splice(i,1);p.likes=Math.max(0,p.likes-1)}save();render()},
pmore(e){const p=post(e.id),it=[];if(p.mine)it.push({l:'게시글 수정',a:'edit',id:p.id},{l:'삭제',a:'delc',id:p.id,d:1});else it.push({l:'관심 없음',a:'notint',id:p.id},{l:'이 게시글 신고하기',a:'report',d:1});sheet('',it)},
notint(e){S.notInt.push(e.id);save();toast('이 게시글을 숨겼어요');if(cur().s==='detail')back();else render()},
report(){toast('신고가 접수됐어요 (시뮬레이션)')},
delc(e){sheet('게시글을 삭제할까요?<br><small style="color:var(--fg2)">삭제한 글은 복구할 수 없어요.</small>',[{l:'삭제',a:'delok',id:e.id,d:1},{l:'취소',a:'close'}])},
delok(e){delPost(e.id);toast('삭제했어요');if(cur().s==='detail')nav.pop();render()},
edit(e){editing=e.id;push('write',{id:e.id})},
write(){editing=null;FI=[];push('write',{})},
wtype(e){document.querySelectorAll('#tg .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===e.v));$('#pw').hidden=e.v==='share';$('#dw').hidden=e.v!=='sale';$('#pl').textContent=e.v==='job'?'시급 (원)':'가격 (원)'},
rmimg(e){FI.splice(+e.v,1);drawPh()},
submit(){const ty=document.querySelector('#tg .chip.on').dataset.v,title=$('#f-title').value.trim(),pr=parseInt(($('#f-price').value||'').replace(/[^\d]/g,''))||0;if(!title)return toast('제목을 입력해 주세요');if(ty!=='share'&&!pr)return toast('가격을 입력해 주세요');
const d={type:ty,title,price:ty==='share'?0:pr,direct:ty==='sale'&&$('#f-direct').checked?1:0,cat:ty==='job'?'알바':$('#f-cat').value,desc:$('#f-desc').value.trim(),place:$('#f-place').value.trim(),imgs:[...FI]};const t=cur();
if(t.id){Object.assign(post(t.id),d);toast('수정했어요')}else{S.posts.unshift(Object.assign({id:'p'+Date.now(),dong:me.dong,dist:'0m',seller:me,mine:1,status:'sale',created:Date.now(),bumped:Date.now(),views:0,likes:0,chats:0,bumps:0},d));toast('등록했어요');manF='sale'}save();FI=[];nav.pop();render()},
chatp(e){openChat(e.id)},room(e){push('room',{id:e.id})},
send(){const i=$('#inp'),v=i.value.trim();if(!v)return;const c=chat(cur().id);c.msgs.push({me:1,text:v,t:Date.now()});c.upd=Date.now();i.value='';save();drawMsgs();updSend();const id=c.id;setTimeout(()=>{const c=chat(id);if(!c)return;c.msgs.push({me:0,text:REP[Math.floor(Math.random()*REP.length)],t:Date.now()});c.upd=Date.now();const inRoom=cur().s==='room'&&cur().id===id;if(inRoom)drawMsgs();else c.unread++;save();renderTabs()},1400)},
emoji(){const i=$('#inp');i.value+='😊';updSend();i.focus()},
search(){push('search')},notif(){S.nbell=1;push('notif')},
menu(){sheet('전체 메뉴',[{l:'판매관리',a:'manage'},{l:'관심목록',a:'list',v:'likes'},{l:'최근 본',a:'list',v:'recents'},{l:'동네 설정',a:'toast',m:'동네 설정은 시뮬레이션이에요'}])},
gear(){sheet('설정',[{l:'데이터 초기화',a:'reset',d:1},{l:'닫기',a:'close'}])},
reset(){try{localStorage.removeItem(KEY)}catch(e){}S=seed();nav=[{s:'my'}];render();toast('초기화했어요')},
manage(){push('manage')},list(e){push('list',{k:e.v})},sf(e){homeF=e.v;go('home')},
nopromo(){S.promo=0;save();render()},
bump(e){const p=post(e.id);p.bumped=Date.now();p.bumps++;save();render();toast('끌어올렸어요')},
mmore(e){const p=post(e.id),it=[{l:'게시글 수정',a:'edit',id:p.id}];if(p.status==='sale')it.push({l:'거래완료로 변경',a:'setst',id:p.id,v:'done'},{l:'숨기기',a:'setst',id:p.id,v:'hidden'});else it.push({l:'판매중으로 변경',a:'setst',id:p.id,v:'sale'});it.push({l:'삭제',a:'delc',id:p.id,d:1});sheet('',it)},
setst(e){post(e.id).status=e.v;save();render();toast('변경했어요')},
clrs(){S.searches=[];save();drawSearch()},rs(e){$('#q').value=e.v;addRecent(e.v);drawSearch()},rms(e){S.searches.splice(+e.v,1);save();drawSearch()}};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;if(a==='noop')return;const f=ACT[a];if(!f)return;if(a!=='close')ACT.close();f(el.dataset)});
document.addEventListener('click',ev=>{const r=ev.target.closest('.item[data-a=open]');if(r&&cur().s==='search')addRecent($('#q').value)},true);
render();
</script>
