<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pinterest</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#5f5f5f;--chip:#e9e9e4;--red:#e60023;--sheet:#fff;--bar:rgba(255,255,255,.92)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#f4f4f4;--mut:#aaa;--chip:#2b2b2b;--sheet:#1e1e1e;--bar:rgba(30,30,30,.92)}}
:root[data-theme="dark"]{--bg:#121212;--fg:#f4f4f4;--mut:#aaa;--chip:#2b2b2b;--sheet:#1e1e1e;--bar:rgba(30,30,30,.92)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Helvetica Neue","Apple SD Gothic Neo",Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.layer{position:absolute;inset:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 8px}
.logo{display:flex;align-items:center;gap:4px;font-weight:800;font-size:27px;letter-spacing:-1.3px}
.ib{width:40px;height:40px;display:grid;place-items:center;position:relative}
.dot{position:absolute;top:6px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.mas{display:flex;gap:6px;padding:4px 6px 0}
.col{flex:1;min-width:0}
.card{margin-bottom:6px}
.card img{width:100%;display:block;border-radius:20px;background:var(--chip)}
.meta{display:flex;align-items:center;justify-content:space-between;min-height:30px;padding:2px 4px 0 6px;font-size:13.5px;gap:4px}
.meta span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.meta button{margin-left:auto;width:30px;height:28px;display:grid;place-items:center;flex:none}
.back{position:sticky;top:8px;z-index:5;margin:8px 0 -48px 10px;width:46px;height:46px;border-radius:16px;background:var(--bar);display:grid;place-items:center;box-shadow:0 1px 6px rgba(0,0,0,.15)}
.hero{margin:0 6px;position:relative}
.hero img{width:100%;border-radius:24px;display:block}
.isr{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:20px;background:rgba(255,255,255,.75);color:#111;font-weight:500;font-size:15px;backdrop-filter:blur(8px)}
.acts{display:flex;align-items:center;gap:6px;padding:14px 12px 6px}
.acts .a{display:flex;align-items:center;gap:6px;height:44px;padding:0 8px;font-weight:600;font-size:15px}
.save{margin-left:auto;background:var(--red);color:#fff;font-weight:700;font-size:16px;border-radius:18px;padding:0 24px;height:48px}
.save.on{background:#111;color:#fff}
.info{padding:6px 16px}
.au{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:14px;margin:6px 0}
.ttl{display:flex;align-items:center;gap:8px;font-size:23px;font-weight:700;letter-spacing:-.5px;line-height:1.25;margin:6px 0}
.ttl .t{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ttl.x .t{white-space:normal}
.chev{width:34px;height:30px;border-radius:10px;background:var(--chip);display:grid;place-items:center;flex:none}
.desc{color:var(--mut);font-size:17px;line-height:1.35}
.desc b{color:var(--fg);margin-left:6px;cursor:pointer}
.rh{padding:14px 16px 6px;font-weight:700;font-size:17px}
.nav{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:12px;z-index:20;pointer-events:none}
.nav button{pointer-events:auto;width:74px;height:60px;border-radius:20px;background:var(--bar);display:grid;place-items:center;box-shadow:0 2px 12px rgba(0,0,0,.16)}
.av{border-radius:50%;width:26px;height:26px;flex:none}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--sheet);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:16px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:78%;overflow:auto}
.sh h3{margin:2px 0 12px;text-align:center;font-size:17px}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;font-size:16px;width:100%;text-align:left}
.row .sw{width:44px;height:44px;border-radius:12px;flex:none}
.cm{display:flex;gap:10px;padding:8px 0}
.cm .av{width:34px;height:34px}.cm small{color:var(--mut)}
.inp{display:flex;gap:8px;margin-top:10px}
.inp input,.f input,.f textarea{flex:1;border:1px solid var(--chip);background:var(--bg);color:var(--fg);border-radius:16px;padding:12px 14px;font:inherit;font-size:16px;width:100%}
.pri{background:var(--red);color:#fff;border-radius:16px;padding:0 18px;font-weight:700;min-height:44px}
.f{display:flex;flex-direction:column;gap:10px}
.prev{width:100%;max-height:220px;object-fit:contain;border-radius:16px;background:var(--chip)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:14px;z-index:60;font-size:14px}
.spin{position:absolute;inset:0;border-radius:24px;background:rgba(255,255,255,.55);display:grid;place-items:center;font-weight:700;color:#111}
</style></head><body>
<div id="app"></div>
<div class="nav" id="nav">
<button id="nHome" aria-label="홈"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 3.2c-1 0-1.800.4-2.500 1.100L4.300 9.600C3.500 10.400 3 11.400 3 12.500V18c0 1.700 1.300 3 3 3h12c1.700 0 3-1.300 3-3v-5.500c0-1.100-.5-2.100-1.300-2.900l-5.200-5.300C13.800 3.600 13 3.200 12 3.200z" fill="currentColor"/><path d="M9.500 16.200c1.600 1 3.400 1 5 0" stroke="var(--bar)" stroke-width="1.800" stroke-linecap="round" fill="none"/></svg></button>
<button aria-label="검색"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"><circle cx="10.500" cy="10.500" r="6.500"/><path d="M15.500 15.500L21 21"/></svg></button>
<button aria-label="내 프로필"><svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="#b9a08f"/><circle cx="17" cy="14" r="5.500" fill="#f2d9c8"/><path d="M6 28c2-6 6-8 11-8s9 2 11 8a15 15 0 0 1-22 0z" fill="#6c7f9b"/></svg></button>
</div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const I={
back:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4L7 12l8 8"/></svg>',
plus:'<svg width="30" height="30" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M3 12h18"/></svg>',
chat:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.100" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.500c-4.700 0-8.500 3.400-8.500 7.800 0 2.300 1 4.300 2.700 5.700L5.500 20.500l3.800-1.700c.9.200 1.800.4 2.700.4 4.700 0 8.500-3.400 8.500-7.800S16.700 3.500 12 3.500z"/><circle cx="8.500" cy="11.300" r=".6" fill="currentColor"/><circle cx="12" cy="11.300" r=".6" fill="currentColor"/><circle cx="15.500" cy="11.300" r=".6" fill="currentColor"/></svg>',
heart:(on)=>`<svg width="32" height="32" viewBox="0 0 24 24" fill="${on?'#e60023':'none'}" stroke="${on?'#e60023':'currentColor'}" stroke-width="1.900" stroke-linejoin="round"><path d="M12 20.500S3 15 3 8.800C3 6 5 4 7.500 4c1.900 0 3.600 1.100 4.500 2.700C12.900 5.100 14.600 4 16.500 4 19 4 21 6 21 8.800 21 15 12 20.500 12 20.500z"/></svg>`,
cmt:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.900"><ellipse cx="12" cy="12" rx="8.500" ry="8"/></svg>',
share:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.500M7.500 8L12 3.500 16.500 8M4 13v6.500h16V13"/></svg>',
more:'<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.800"/><circle cx="12" cy="12" r="1.800"/><circle cx="19" cy="12" r="1.800"/></svg>',
chev:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
lens:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-3-6.200"/><path d="M15 15l5 5"/><path d="M19 2l.8 2.200L22 5l-2.200.8L19 8l-.8-2.200L16 5l2.200-.8z" fill="#111" stroke="none"/></svg>',
send:'<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M3 11.500L21 3l-8.500 18-2-7.500z"/></svg>',
logo:'<svg width="34" height="34" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="none" stroke="#e60023" stroke-width="2"/><path d="M12.300 5.500c-3.200 0-4.800 2.100-4.800 4.200 0 1.100.5 2.100 1.300 2.400.2.100.3 0 .4-.2l.2-.8c0-.2 0-.3-.1-.4-.3-.4-.5-.9-.5-1.500 0-1.900 1.400-3.200 3.300-3.200 1.700 0 2.700 1 2.700 2.500 0 1.900-.8 3.500-2.100 3.500-.7 0-1.200-.6-1-1.300.2-.8.6-1.700.6-2.300 0-.5-.3-.9-.9-.9-.7 0-1.300.7-1.300 1.700 0 .6.2 1 .2 1l-.9 3.600c-.2 1-.1 2.200 0 2.900h.2c.4-.6 1.100-1.700 1.400-2.700l.5-1.900c.3.500 1 .9 1.900.9 2.500 0 4.200-2.300 4.200-5.200 0-2.200-1.900-4.400-5.200-4.400z" fill="#e60023"/></svg>'};
/* ---------- state ---------- */
const S=(()=>{let d={likes:{},saves:{},cm:{},mine:[],hidden:{}};try{Object.assign(d,JSON.parse(localStorage.getItem('pin')||'{}'))}catch(e){}return d})();
const persist=()=>{try{localStorage.setItem('pin',JSON.stringify(S))}catch(e){try{S.mine.forEach(p=>p.src=p.src.length>1e5?'':p.src);localStorage.setItem('pin',JSON.stringify(S))}catch(_){}}};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1500)};
/* ---------- data ---------- */
const G=['포스터 디자인','게임 UI','일러스트','인물 화보','모션 GIF','색감 레퍼런스'];
const AU=['miri_lab','かれんたん','sandeoki','pixel.moon','studio_hana','juno.kim','atelier_o','rosewater'];
const R=[1.32,.82,1.55,1.0,1.75,.9,1.2,1.42];
const DS=['빛과 색의 조합이 인상적인 작업물. 저장해 두고 영감이 필요할 때 꺼내 보세요.','레이아웃과 여백이 깔끔하게 정리된 레퍼런스입니다.','작가의 시선이 느껴지는 장면. 분위기를 참고하기 좋아요.'];
const rnd=(s)=>{let x=Math.sin(s*9301+49297)*233280;return x-Math.floor(x)};
const pins={};
function pin(i){if(pins[i])return pins[i];const g=i%6,r=R[(i*5+g)%8];
 return pins[i]={id:i,group:g,r,title:G[g]+' #'+(Math.floor(i/6)+1),author:AU[(i*3+g)%8],desc:DS[i%3],likes:120+Math.floor(rnd(i)*4800),cmt:3+Math.floor(rnd(i+7)*60),src:art(i,g,r),showT:(i%3)!==1}}
function art(i,g,r){const W=300,H=Math.round(300*r),h=g*60+10+Math.floor(rnd(i)*40),c=(o,l=60)=>`hsl(${(h+o)%360},70%,${l}%)`;let b='';
 for(let k=0;k<5;k++){const x=rnd(i*7+k)*W,y=rnd(i*11+k)*H,s=30+rnd(i*13+k)*90;
  if(g==0)b+=`<rect x="${x-s/2}" y="${y-s/2}" width="${s}" height="${s*1.4}" fill="${c(k*30,55+k*5)}" transform="rotate(${k*15} ${x} ${y})"/>`;
  else if(g==1)b+=`<rect x="14" y="${14+k*(H-28)/5}" width="${W-28}" height="${(H-28)/5-8}" rx="14" fill="${c(k*12,k%2?72:82)}"/><circle cx="40" cy="${14+k*(H-28)/5+((H-28)/5-8)/2}" r="14" fill="${c(180,60)}"/>`;
  else if(g==2)b+=`<ellipse cx="${x}" cy="${y}" rx="${s}" ry="${s*.7}" fill="${c(k*25,70)}" opacity=".85"/>`;
  else if(g==3){if(k<1)b+=`<circle cx="${W/2}" cy="${H*.32}" r="${W*.17}" fill="${c(20,82)}"/><path d="M${W*.15} ${H} C${W*.2} ${H*.55} ${W*.8} ${H*.55} ${W*.85} ${H}z" fill="${c(200,35)}"/>`}
  else if(g==4)b+=`<circle cx="${W/2}" cy="${H/2}" r="${(5-k)*W*.09}" fill="${c(k*20,40+k*10)}"/>`;
  else b+=`<rect x="0" y="${k*H/5}" width="${W}" height="${H/5+1}" fill="${c(k*22,45+k*9)}"/>`;}
 return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c(0,88)}"/><stop offset="1" stop-color="${c(40,76)}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#a)"/>${b}</svg>`)}
const avatar=n=>{const h=(n.charCodeAt(0)*37)%360;return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="hsl(${h},55%,60%)"/><text x="20" y="26" font-size="18" text-anchor="middle" fill="#fff" font-family="Arial">${esc(n[0].toUpperCase())}</text></svg>`)};
const getPin=id=>String(id)[0]==='u'?S.mine.find(p=>p.id===id):pin(+id);
const fmt=n=>n>=1000?(n/1000).toFixed(1)+'천':n;
const comments=id=>{if(!S.cm[id]){const p=getPin(id);S.cm[id]=[0,1,2].map(k=>({n:AU[(k*3+(+id||0))%8],t:['정말 멋져요!','저장해 갑니다','색감이 너무 좋아요'][k],w:(k+1)+'시간 전'}))}return S.cm[id]};
/* ---------- masonry ---------- */
function mason(el,gen,pre){const m={cols:[0,1].map(()=>{const d=document.createElement('div');d.className='col';return d}),h:[0,0],n:0,pre:pre||[]};
 el.append(...m.cols);
 m.add=k=>{for(let j=0;j<k;j++){const p=m.pre.length?m.pre.shift():gen(m.n++);if(!p||S.hidden[p.id])continue;const c=m.h[0]<=m.h[1]?0:1;m.h[c]+=p.r+(p.showT?.12:.08);m.cols[c].appendChild(card(p))}};
 return m}
function card(p){const d=document.createElement('div');d.className='card';
 d.innerHTML=`<img src="${p.src}" alt="" loading="lazy" style="aspect-ratio:${1/p.r}" onerror="this.style.minHeight='120px'"><div class="meta">${p.showT?`<span>${esc(p.title)}</span>`:''}<button aria-label="더 보기">${I.more}</button></div>`;
 d.querySelector('img').onclick=()=>open(p.id);
 d.querySelector('button').onclick=e=>{e.stopPropagation();pinMenu(p,d)};return d}
function infinite(layer,m){layer.addEventListener('scroll',()=>{if(layer.scrollTop+layer.clientHeight>layer.scrollHeight-700)m.add(8)})}
/* ---------- home ---------- */
const home=document.createElement('div');home.className='layer';
home.innerHTML=`<div class="hdr"><div class="logo">${I.logo}Pinterest</div><div style="display:flex"><button class="ib" id="add" aria-label="핀 만들기">${I.plus}</button><button class="ib" aria-label="메시지">${I.chat}<i class="dot"></i></button></div></div><div class="mas" id="hm"></div>`;
app.appendChild(home);
const hm=mason(home.querySelector('#hm'),i=>pin(i),[...S.mine]);hm.add(14);infinite(home,hm);
$('#add').onclick=createPin;
$('#nHome').onclick=()=>{[...app.querySelectorAll('.layer.top')].forEach(l=>l.remove());home.scrollTo({top:0,behavior:'smooth'})};
/* ---------- layers ---------- */
function push(html){const l=document.createElement('div');l.className='layer top';l.innerHTML=html;app.appendChild(l);return l}
const pop=l=>l.remove();
function open(id){const p=getPin(id);const L=push(`<button class="back" aria-label="뒤로">${I.back}</button><div class="hero"><img src="${p.src}" alt="" style="aspect-ratio:${1/p.r}"><button class="isr">이미지 검색 ${I.lens}</button></div><div class="acts"></div><div class="info"></div><div class="rh">비슷한 핀</div><div class="mas" id="rm"></div>`);
 L.querySelector('.back').onclick=()=>pop(L);
 const render=()=>{const lk=!!S.likes[p.id],sv=!!S.saves[p.id];const n=p.likes+(lk?1:0);
  L.querySelector('.acts').innerHTML=`<button class="a" data-a="l">${I.heart(lk)}${fmt(n)}</button><button class="a" data-a="c">${I.cmt}${comments(p.id).length+p.cmt}</button><button class="a" data-a="s">${I.share}</button><button class="a" data-a="m">${I.more}</button><button class="save ${sv?'on':''}" data-a="v">${sv?'저장됨':'저장'}</button>`;
  L.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>({l:()=>{S.likes[p.id]=!S.likes[p.id];persist();render()},c:()=>cmSheet(p),s:()=>shareSheet(p),m:()=>pinMenu(p),v:()=>saveSheet(p,render)})[b.dataset.a]())};
 render();
 const inf=L.querySelector('.info');inf.innerHTML=`<div class="au"><img class="av" src="${avatar(p.author)}" alt="">${esc(p.author)}</div><div class="ttl"><span class="t">${esc(p.title)}</span><button class="chev" aria-label="펼치기">${I.chev}</button></div><div class="desc">${esc(p.desc)}<b>전체 댓글 보기</b></div>`;
 inf.querySelector('.chev').onclick=()=>inf.querySelector('.ttl').classList.toggle('x');
 inf.querySelector('b').onclick=()=>cmSheet(p);
 L.querySelector('.isr').onclick=()=>{const h=L.querySelector('.hero');const s=document.createElement('div');s.className='spin';s.textContent='비슷한 핀 찾는 중…';h.appendChild(s);setTimeout(()=>{s.remove();related(p)},600)};
 const rm=mason(L.querySelector('#rm'),k=>pin(((+p.id||0)%6)+6*(k+1+Math.floor((+p.id||0)/6)*0)+(k>40?k:0)));rm.add(10);infinite(L,rm)}
function related(p){const L=push(`<button class="back" aria-label="뒤로">${I.back}</button><div class="info" style="padding-top:62px"><div class="ttl x"><span class="t">${esc(p.title)}</span></div><div class="desc">${esc(p.desc)}</div></div><div class="mas" id="rm" style="margin-top:10px"></div>`);
 L.querySelector('.back').onclick=()=>pop(L);
 const g=(+p.id||0)%6,off=Math.floor((+p.id||0)/6);const rm=mason(L.querySelector('#rm'),k=>pin(g+6*(k+off+1)));rm.add(14);infinite(L,rm)}
/* ---------- sheets ---------- */
function sheet(html,cb){const b=document.createElement('div');b.className='bd';b.innerHTML=`<div class="sh">${html}</div>`;b.onclick=e=>{if(e.target===b)b.remove()};document.body.appendChild(b);cb&&cb(b);return b}
function cmSheet(p){const draw=b=>{const c=comments(p.id);b.querySelector('.lst').innerHTML=c.map(x=>`<div class="cm"><img class="av" src="${avatar(x.n)}" alt=""><div><b>${esc(x.n)}</b> <small>${esc(x.w)}</small><div>${esc(x.t)}</div></div></div>`).join('')};
 sheet(`<h3>댓글</h3><div class="lst"></div><div class="inp"><input placeholder="댓글 추가"><button class="pri" aria-label="전송">${I.send}</button></div>`,b=>{draw(b);const i=b.querySelector('input'),go=()=>{const v=i.value.trim();if(!v)return;comments(p.id).push({n:'나',t:v,w:'방금'});persist();i.value='';draw(b)};b.querySelector('.pri').onclick=go;i.onkeydown=e=>e.key==='Enter'&&go()})}
function shareSheet(p){sheet(`<h3>공유</h3><button class="row" data-k="c">링크 복사</button><button class="row" data-k="n">다른 앱으로 공유</button>`,b=>{b.querySelector('[data-k=c]').onclick=()=>{try{navigator.clipboard.writeText(location.href+'#pin'+p.id).then(()=>toast('링크를 복사했어요'),()=>toast('복사할 수 없어요'))}catch(e){toast('복사할 수 없어요')}b.remove()};b.querySelector('[data-k=n]').onclick=()=>{if(navigator.share)navigator.share({title:p.title,url:location.href}).catch(()=>{});else toast('이 기기에서는 지원하지 않아요');b.remove()}})}
function pinMenu(p,cardEl){sheet(`<h3>핀 옵션</h3><button class="row" data-k="v">${S.saves[p.id]?'저장 취소':'저장'}</button><button class="row" data-k="s">공유</button><button class="row" data-k="h">이 핀 숨기기</button>`,b=>{b.querySelector('[data-k=v]').onclick=()=>{S.saves[p.id]=S.saves[p.id]?0:'내 보드';persist();toast(S.saves[p.id]?'저장했어요':'저장을 취소했어요');b.remove()};b.querySelector('[data-k=s]').onclick=()=>{b.remove();shareSheet(p)};b.querySelector('[data-k=h]').onclick=()=>{S.hidden[p.id]=1;persist();if(cardEl)cardEl.remove();toast('핀을 숨겼어요');b.remove()}})}
function saveSheet(p,done){const bs=['내 보드','영감','디자인 레퍼런스'];sheet(`<h3>보드 선택</h3>${bs.map((n,i)=>`<button class="row" data-b="${n}"><span class="sw" style="background:hsl(${i*70+10},60%,70%)"></span>${n}</button>`).join('')}${S.saves[p.id]?'<button class="row" data-b="">저장 취소</button>':''}`,b=>b.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>{S.saves[p.id]=x.dataset.b||0;persist();done&&done();toast(x.dataset.b?x.dataset.b+'에 저장했어요':'저장을 취소했어요');b.remove()}))}
function createPin(){let src='',r=1.2;sheet(`<h3>핀 만들기</h3><div class="f"><input type="file" accept="image/*"><img class="prev" alt="" hidden><input id="ct" placeholder="제목"><textarea id="cd" rows="3" placeholder="설명"></textarea><button class="pri">저장</button></div>`,b=>{const f=b.querySelector('input[type=file]'),pv=b.querySelector('.prev');
 f.onchange=()=>{const file=f.files[0];if(!file)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{r=Math.min(2,Math.max(.6,im.height/im.width));src=fr.result;pv.src=src;pv.hidden=false};im.src=fr.result};fr.readAsDataURL(file)};
 b.querySelector('.pri').onclick=()=>{if(!src){toast('이미지를 선택해 주세요');return}const t=b.querySelector('#ct').value.trim()||'제목 없음';const p={id:'u'+Date.now(),group:0,r,title:t,author:'나',desc:b.querySelector('#cd').value.trim(),likes:0,cmt:0,src,showT:true};S.mine.unshift(p);persist();hm.pre.unshift(p);const c=card(p);hm.cols[0].prepend(c);b.remove();toast('핀을 만들었어요')}})}
</script></body></html>
