<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Home</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"SF Pro","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#fff;background:#000}

/* 배경: 아이폰 기본 월페이퍼 느낌의 그라디언트 */
#wall{position:fixed;inset:0;background:
  radial-gradient(120% 70% at 10% 0%,#7ec8ff 0%,transparent 60%),
  radial-gradient(100% 60% at 100% 30%,#c7a6ff 0%,transparent 60%),
  radial-gradient(120% 80% at 50% 100%,#ffb3c7 0%,transparent 65%),
  linear-gradient(160deg,#4f7bff 0%,#8f6cff 45%,#ff8fb1 100%);}

#phone{position:relative;width:100%;max-width:none;height:100dvh;margin:0 auto;display:flex;flex-direction:column;z-index:1}

/* 상태바 */
.sb{height:54px;flex:none;position:relative;font-weight:600;font-size:17px}
.sb .t{position:absolute;left:36px;top:17px}
.sb .r{position:absolute;right:24px;top:19px;display:flex;gap:6px;align-items:center}
.sb .sig,.sb .bat{background:#fff;border-radius:2px}
.sb .sig{width:17px;height:11px}
.sb .bat{width:25px;height:12px;border-radius:4px}

/* 날짜/시간 위젯 */
.clock{text-align:center;margin-top:18px;text-shadow:0 1px 6px rgba(0,0,0,.15)}
.clock .d{font-size:17px;font-weight:500;opacity:.9}
.clock .h{font-size:92px;font-weight:300;line-height:1;letter-spacing:-2px}

/* 앱 그리드 */
#grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);row-gap:22px;column-gap:6px;align-content:start;padding:36px 14px 0;overflow-y:auto}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:#fff;font:inherit;cursor:pointer;padding:0}
.ic{width:62px;height:62px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 2px 8px rgba(0,0,0,.18);overflow:hidden;position:relative}
.ic::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.22),transparent 55%);border-radius:inherit;pointer-events:none}
.lb{font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.35);max-width:78px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app:active .ic{transform:scale(.92)}
.ic{transition:transform .12s ease}

/* 도크 */
#dock{flex:none;margin:10px 12px 22px;padding:12px 14px;border-radius:30px;background:rgba(255,255,255,.28);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;justify-content:space-around}
#dock .app .ic{width:58px;height:58px}
.hint{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#fff;opacity:.85}

/* 앱 실행 오버레이 */
#viewer{position:fixed;inset:0;z-index:10;background:#000;display:none;flex-direction:column;align-items:center}
#viewer.on{display:flex;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px) scale(.98);opacity:0}to{transform:none;opacity:1}}
#viewer .frame{flex:1;width:100%;max-width:none;border:0;background:#fff}
#viewer .close{position:absolute;top:10px;right:12px;z-index:11;height:34px;padding:0 14px;border-radius:17px;border:0;background:rgba(0,0,0,.55);color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer;backdrop-filter:blur(8px)}
</style>
</head>
<body>
<div id="wall"></div>

<div id="phone">
  <div class="sb">
    <span class="t" id="stime">9:41</span>
    <span class="r">
      <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="4.5" y="5.5" width="3" height="6.5" rx="1" fill="#fff"/><rect x="9" y="3" width="3" height="9" rx="1" fill="#fff"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#fff"/></svg>
      <span class="bat"></span>
    </span>
  </div>

  <div class="clock">
    <div class="d" id="cdate"></div>
    <div class="h" id="ctime"></div>
  </div>

  <div id="grid"></div>

  <div id="dock"></div>
  <div class="hint"></div>
</div>

<div id="viewer">
  <button class="close" id="close">닫기</button>
  <iframe class="frame" id="frame" title="app"></iframe>
</div>

<script>
/* =========================================================
   앱 목록. 새 데모를 추가할 땐 아래 배열에 한 줄만 넣으면 됨.
   file: 같은 폴더의 html 파일 이름
   icon: 이모지 또는 짧은 글자
   color: 아이콘 배경색 (그라디언트 시작/끝)
   dock: true 면 하단 도크에 표시
   ========================================================= */
const APPS = [
  { name: "메시지", file: "IMessage.html", icon: "💬", color: ["#5ee38a", "#22b04a"] },
  { name: "카카오톡", file: "Kakaotalk.html", icon: "💛", color: ["#ffe812", "#f5c900"] },
  { name: "인스타그램", file: "Instagram.html", icon: "📸", color: ["#f58529", "#dd2a7b"] },
  { name: "X", file: "X.html", icon: "𝕏", color: ["#333333", "#000000"] },
  { name: "카메라", file: "camera/index.html", icon: "📷", color: ["#4a4a4f", "#1c1c1e"] },
  { name: "사진", file: "Photo.html", icon: "🌈", color: ["#ffffff", "#dfe5ff"] },
  { name: "시계", file: "Clock.html", icon: "🕒", color: ["#333333", "#111111"] },
  { name: "메모", file: "Memo.html", icon: "📝", color: ["#fff6a8", "#ffd84d"] },
  { name: "설정", file: "Settings.html", icon: "⚙️", color: ["#cfd3d8", "#8f969e"] },
  { name: "뮤직", file: "music.html", icon: "🎵", color: ["#ff6482", "#a90036"] },
  { name: "프롬", file: "fromm.html", icon: "💌", color: ["#8be0e5", "#37a9cf"] },
  { name: "유튜브", file: "YouTube.html", icon: "▶️", color: ["#ff4e45", "#d9120a"] },
  { name: "번역", file: "Translate.html", icon: "文", color: ["#7fd6e2", "#55C2D0"] }
];

const DOCK_FALLBACK = ["메시지"];

const grid = document.getElementById("grid");
const dock = document.getElementById("dock");
const viewer = document.getElementById("viewer");
const frame = document.getElementById("frame");

function makeIcon(app) {
  const btn = document.createElement("button");
  btn.className = "app";
  btn.innerHTML =
    `<span class="ic" style="background:linear-gradient(${app.color[0]},${app.color[1]})">${app.icon}</span>` +
    `<span class="lb"></span>`;
  btn.querySelector(".lb").textContent = app.name;
  btn.addEventListener("click", () => open(app));
  return btn;
}

function render() {
  const dockApps = APPS.filter(a => a.dock || DOCK_FALLBACK.includes(a.name)).slice(0, 4);
  APPS.forEach(a => grid.appendChild(makeIcon(a)));
  dockApps.forEach(a => dock.appendChild(makeIcon(a)));
}

function open(app) {
  frame.src = app.file;
  viewer.classList.add("on");
}

function close() {
  viewer.classList.remove("on");
  frame.src = "about:blank";
}

document.getElementById("close").addEventListener("click", close);
document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });

function tick() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  document.getElementById("stime").textContent = `${now.getHours()}:${mm}`;
  document.getElementById("ctime").textContent = `${hh}:${mm}`;
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  document.getElementById("cdate").textContent =
    `${now.getMonth() + 1}월 ${now.getDate()}일 (${days[now.getDay()]})`;
}

render();
tick();
setInterval(tick, 10000);
</script>
</body>
</html>
